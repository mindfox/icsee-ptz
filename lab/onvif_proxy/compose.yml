services:
  frigate-onvif-proxy:
    build:
      context: .
    container_name: frigate-onvif-proxy
    restart: unless-stopped
    environment:
      CAMERA_HOST: ${CAMERA_HOST}
      CAMERA_ONVIF_PORT: ${CAMERA_ONVIF_PORT:-8899}
      CAMERA_USERNAME: ${CAMERA_USERNAME}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD}
      PROXY_LISTEN_HOST: ${PROXY_LISTEN_HOST:-0.0.0.0}
      PROXY_LISTEN_PORT: ${PROXY_LISTEN_PORT:-8999}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-10}
      UPSTREAM_RETRY_INITIAL_SECONDS: ${UPSTREAM_RETRY_INITIAL_SECONDS:-0.25}
      UPSTREAM_RETRY_MAX_SECONDS: ${UPSTREAM_RETRY_MAX_SECONDS:-2.0}
      CONTINUOUS_VELOCITY: ${CONTINUOUS_VELOCITY:-0.5}
      PULSE_MIN_SECONDS: ${PULSE_MIN_SECONDS:-0.04}
      PULSE_SECONDS_PER_FOV: ${PULSE_SECONDS_PER_FOV:-0.80}
      PULSE_MAX_SECONDS: ${PULSE_MAX_SECONDS:-1.00}
      STATUS_SETTLE_SECONDS: ${STATUS_SETTLE_SECONDS:-0.20}
      RETURN_PRESET_ZOOM_RESET: ${RETURN_PRESET_ZOOM_RESET:-true}
      RETURN_PRESET_ZOOM_DELAY_SECONDS: ${RETURN_PRESET_ZOOM_DELAY_SECONDS:-0.25}
      RETURN_PRESET_ZOOM_VELOCITY: ${RETURN_PRESET_ZOOM_VELOCITY:--0.5}
      RETURN_PRESET_ZOOM_SECONDS: ${RETURN_PRESET_ZOOM_SECONDS:-8.0}
      ONVIF_PROXY_CONFIG: /app/config.yaml
    ports:
      - "${PROXY_PORT:-8999}:8999"
    volumes:
      - ./proxy.py:/app/proxy.py:ro
      - ./relative_zoom.py:/app/relative_zoom.py:ro
      - ./config_loader.py:/app/config_loader.py:ro
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
